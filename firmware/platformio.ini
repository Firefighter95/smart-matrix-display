[platformio]
boards_dir = boards
default_envs = waveshare-esp32-s3-rgb-matrix

[env:waveshare-esp32-s3-rgb-matrix]
platform = espressif32
board = waveshare_esp32_s3_rgb_matrix
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
board_build.partitions = partitions_ota.csv
lib_ldf_mode = chain+
build_flags =
  -DSMART_MATRIX_HARDWARE_TEST=1
  -DCORE_DEBUG_LEVEL=1
lib_deps =
  https://github.com/mrfaptastic/ESP32-HUB75-MatrixPanel-DMA.git
  https://github.com/ESP32Async/ESPAsyncWebServer.git
  https://github.com/ESP32Async/AsyncTCP.git
  adafruit/Adafruit GFX Library@^1.11.11
  bblanchon/ArduinoJson@^7.0.4

; Network OTA profile. Override upload_port with the current IP when mDNS is unavailable.
[env:waveshare-esp32-s3-rgb-matrix-ota]
extends = env:waveshare-esp32-s3-rgb-matrix
upload_protocol = espota
upload_port = smartmatrix.local

[env:hardware-validation]
extends = env:waveshare-esp32-s3-rgb-matrix
build_flags =
  ${env:waveshare-esp32-s3-rgb-matrix.build_flags}
  -DSMART_MATRIX_HARDWARE_VALIDATION=1

; Hardware diagnosis profiles. Each profile keeps the same GPIO and scan
; configuration but changes one driver/timing variable for A/B testing.
[env:hardware-validation-fm6124]
extends = env:hardware-validation
build_flags =
  ${env:hardware-validation.build_flags}
  -DSMART_MATRIX_DIAGNOSTIC_FM6124=1

[env:hardware-validation-shiftreg]
extends = env:hardware-validation
build_flags =
  ${env:hardware-validation.build_flags}
  -DSMART_MATRIX_DIAGNOSTIC_SHIFTREG=1

[env:hardware-validation-20mhz]
extends = env:hardware-validation
build_flags =
  ${env:hardware-validation.build_flags}
  -DSMART_MATRIX_DIAGNOSTIC_20MHZ=1

[env:hardware-signal-probe]
extends = env:waveshare-esp32-s3-rgb-matrix
build_flags =
  ${env:waveshare-esp32-s3-rgb-matrix.build_flags}
  -DSMART_MATRIX_RAW_SIGNAL_TEST=1
