send_message:
  name: Send message
  description: Show a message on one or more Smart Matrix Display devices.
  target:
    device:
      integration: smart_matrix_display
  fields:
    title:
      name: Title
      description: Optional title shown above the message.
      selector:
        text:
    message:
      name: Message
      description: Main text to show on the matrix.
      required: true
      selector:
        text:
          multiline: true
    duration:
      name: Duration
      description: Number of seconds before the display returns to its normal mode.
      default: 20
      selector:
        number:
          min: 1
          max: 86400
          mode: box
          unit_of_measurement: s
    color:
      name: Color
      default: "#00FF00"
      selector:
        text:
    alignment:
      name: Alignment
      default: center
      selector:
        select:
          options:
            - left
            - center
            - right
    priority:
      name: Priority
      default: 50
      selector:
        number:
          min: 0
          max: 100
          mode: slider

clear_display:
  name: Clear display
  description: Clear the current message and return the display to its normal mode.
  target:
    device:
      integration: smart_matrix_display

restart:
  name: Restart
  description: Restart one or more Smart Matrix Display controllers.
  target:
    device:
      integration: smart_matrix_display

send_weather:
  name: Send weather
  description: Push the current state of a Home Assistant weather entity to one or more displays.
  target:
    device:
      integration: smart_matrix_display
  fields:
    weather_entity_id:
      name: Weather entity
      description: Optional override. If empty, the weather entity selected while adding the display is used.
      selector:
        entity:
          domain: weather

send_p2000:
  name: Send P2000 alert
  description: Push a P2000 alert received by Home Assistant to one or more displays.
  target:
    device:
      integration: smart_matrix_display
  fields:
    title:
      name: Title
      default: P2000
      selector:
        text:
    message:
      name: P2000 message
      required: true
      selector:
        text:
          multiline: true
    location:
      name: Location
      description: Optional location shown before the alert text.
      selector:
        text:
    capcode:
      name: Capcode
      description: Optional source capcode for automation/debugging.
      selector:
        text:
    duration:
      name: Duration
      default: 30
      selector:
        number:
          min: 1
          max: 86400
          mode: box
          unit_of_measurement: s
    color:
      name: Color
      default: "#FF3B30"
      selector:
        text:
    alignment:
      name: Alignment
      default: left
      selector:
        select:
          options:
            - left
            - center
            - right
    priority:
      name: Priority
      default: 90
      selector:
        number:
          min: 0
          max: 100
          mode: slider

show_message:
  name: Show message
  description: Backwards-compatible friendly alias for send_message.
  target:
    device:
      integration: smart_matrix_display
  fields:
    title:
      name: Title
      selector:
        text:
    message:
      name: Message
      required: true
      selector:
        text:
          multiline: true
    duration:
      name: Duration
      default: 20
      selector:
        number:
          min: 1
          max: 86400
          mode: box
          unit_of_measurement: s
    color:
      name: Color
      default: "#00FF00"
      selector:
        text:
    alignment:
      name: Alignment
      default: center
      selector:
        select:
          options: [left, center, right]
    priority:
      name: Priority
      default: 50
      selector:
        number:
          min: 0
          max: 100
          mode: slider

show_layout:
  name: Show layout
  description: Activate a saved layout with a JSON-compatible payload.
  target:
    device:
      integration: smart_matrix_display
  fields:
    layout_id:
      name: Layout ID
      required: true
      selector:
        text:
    duration:
      name: Duration
      default: 20
      selector:
        number:
          min: 1
          max: 86400
          mode: box
          unit_of_measurement: s
    priority:
      name: Priority
      default: 50
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    payload:
      name: Payload
      description: JSON object used to resolve layout variables.
      selector:
        object:

show_event:
  name: Show event
  description: Send a structured event into the Smart Matrix Event Engine.
  target:
    device:
      integration: smart_matrix_display
  fields:
    source:
      name: Source
      required: true
      selector:
        select:
          options: [portal, home_assistant, p2000, system, timer, weather, api]
    event_type:
      name: Event type
      required: true
      selector:
        text:
    layout_id:
      name: Layout ID
      selector:
        text:
    duration:
      name: Duration
      default: 20
      selector:
        number:
          min: 1
          max: 86400
          mode: box
          unit_of_measurement: s
    priority:
      name: Priority
      default: 50
      selector:
        number:
          min: 0
          max: 100
          mode: slider
    payload:
      name: Payload
      selector:
        object:

clear:
  name: Clear
  description: Alias for clear_display.
  target:
    device:
      integration: smart_matrix_display

skip_event:
  name: Skip event
  description: Skip the active event and continue with the queue.
  target:
    device:
      integration: smart_matrix_display

set_brightness:
  name: Set brightness
  description: Set the manual brightness percentage.
  target:
    device:
      integration: smart_matrix_display
  fields:
    brightness:
      name: Brightness
      required: true
      selector:
        number:
          min: 0
          max: 100
          mode: slider
          unit_of_measurement: "%"

set_profile:
  name: Set profile
  description: Select a display behavior profile.
  target:
    device:
      integration: smart_matrix_display
  fields:
    profile_id:
      name: Profile
      required: true
      selector:
        select:
          options: [normal, night, away, demo, fire]
