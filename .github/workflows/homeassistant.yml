name: Home Assistant Integration CI

on:
  push:
  pull_request:

jobs:
  home-assistant:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install validation tools
        run: python -m pip install --upgrade ruff
      - name: Compile integration
        run: python -m compileall -q custom_components
      - name: Lint integration
        run: ruff check custom_components
      - name: Validate JSON metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          root = Path("custom_components/smart_matrix_display")
          for path in [root / "manifest.json", root / "strings.json", Path("hacs.json")]:
              json.loads(path.read_text(encoding="utf-8"))
          PY
